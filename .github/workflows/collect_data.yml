name: Collect global bank interest rates
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 5 * *"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect official observations
        env:
          START_DATE: "2023-12-01"
          END_DATE: "2026-11-15"
        run: python src/collect_data.py
      - name: Commit CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/global_bank_interest_rates.csv
          git diff --cached --quiet || git commit -m "Update global bank interest rate dataset"
          git push
